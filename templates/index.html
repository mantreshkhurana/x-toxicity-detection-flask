<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Toxicity Detection</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="light">
  <header>
    <a href="/" class="header-brand">
      <img src="/images/logo.png" alt="Logo" class="header-logo">
      <h1>X Toxicity Detection</h1>
    </a>
    <div class="toggle-switch">
      <input type="checkbox" id="toggle">
      <label for="toggle"></label>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <div class="image-container">
        <img src="{{ url_for('static', filename='images/hate_speech.svg') }}" height="280" alt="Hate Speech">
      </div>
      <form action="/results" method="POST">
        <div class="search-container">
          <input type="text" placeholder="Enter username" name="username" autocomplete="off" required>
          <input type="number" name="posts" min="1" max="100" value="10" required>
          <button type="submit" id="search-button" disabled>Search</button>
        </div>
      </form>
    </div>

    <div class="bot-protection">
      <span id="bot-calculation"></span>
      <input type="number" placeholder="Answer" name="bot_protection" required>
      <span class="error-message" id="bot-protection-error" style="display: none;">Wrong answer</span>
      <p>Solve to enable search</p>
    </div>
  </main>

  <footer>
    <p>Created by <a href="https://github.com/mantreshkhurana" target="_blank">Mantresh Khurana</a></p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var botInput = document.querySelector('input[name="bot_protection"]');
      var botCalc = document.getElementById("bot-calculation");
      var searchBtn = document.getElementById("search-button");
      var errorMsg = document.getElementById("bot-protection-error");

      var a = Math.floor(Math.random() * 10) + 1;
      var b = Math.floor(Math.random() * 10) + 1;
      var op = Math.random() < 0.5 ? "+" : "-";
      var answer = op === "+" ? a + b : a - b;

      botCalc.textContent = a + " " + op + " " + b + " = ?";

      botInput.addEventListener("input", function() {
        if (parseInt(botInput.value) === answer) {
          searchBtn.disabled = false;
          errorMsg.style.display = "none";
        } else {
          searchBtn.disabled = true;
          if (botInput.value !== "") {
            errorMsg.style.display = "block";
          } else {
            errorMsg.style.display = "none";
          }
        }
      });
    });
  </script>
</body>
</html>
