<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - X Toxicity Detection</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="light">
  <header>
    <a href="/" class="header-brand">
      <img src="/images/logo.png" alt="Logo" class="header-logo">
      <h1>X Toxicity Detection</h1>
    </a>
    <div class="toggle-switch">
      <input type="checkbox" id="toggle">
      <label for="toggle"></label>
    </div>
  </header>

  <div class="error-container">
    <h2>Something went wrong</h2>
    <p class="error-message">{{ error }}</p>
    <p class="error-info">This could be a temporary issue. Try again or check if the username exists.</p>
    <a href="/" class="error-button">Go back</a>
  </div>

  <footer>
    <p>Created by <a href="https://github.com/mantreshkhurana" target="_blank">Mantresh Khurana</a></p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
